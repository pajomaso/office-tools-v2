# DigitalOcean App Platform definition for Office tools v2. NOT deployed: nothing uses this file until someone creates the app.
# Create (once, after the decisions in QUESTIONS-FOR-DAVIDE.md):  doctl apps create --spec .do/app.yaml
# Before that: create the managed database cluster "office-tools-v2-db" (PostgreSQL 16, daily backups),
# fill in the SECRET values in the DigitalOcean dashboard (never in this file), and set up the database with
# scripts/src/setup-real.ts. Deploys are manual (deploy_on_push: false) until someone decides otherwise.
name: office-tools-v2
region: ams   # Amsterdam: closest region to Braga

databases:
  - name: db
    engine: PG
    version: "16"
    production: true                  # a managed cluster with backups, not a throwaway dev database
    cluster_name: office-tools-v2-db  # create it first in Databases

jobs:
  # Applies the database migrations before every deploy. If it fails, the deploy stops and the old version keeps running.
  - name: migrate
    kind: PRE_DEPLOY
    github: { repo: pajomaso/office-tools-v2, branch: main, deploy_on_push: false }
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    build_command: pnpm install --frozen-lockfile
    run_command: pnpm --filter @workspace/db run migrate
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${db.DATABASE_URL}" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, value: "${db.CA_CERT}" }

services:
  # One service serves both the web app and the API on the same address (the sign-in cookie stays first-party).
  - name: web
    github: { repo: pajomaso/office-tools-v2, branch: main, deploy_on_push: false }
    environment_slug: node-js
    build_command: pnpm install --frozen-lockfile && pnpm --filter @workspace/portal run build && pnpm --filter @workspace/api-server run build
    run_command: node artifacts/api-server/dist/index.cjs
    http_port: 8080
    instance_count: 1                 # keep 1: sign-in and supplier-page rate limits live in memory
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check: { http_path: /api/healthz }
    envs:
      - { key: NODE_ENV, scope: RUN_AND_BUILD_TIME, value: production }
      - { key: PORT, scope: RUN_TIME, value: "8080" }
      - { key: PORTAL_STATIC_DIR, scope: RUN_TIME, value: artifacts/portal/dist/public }
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${db.DATABASE_URL}" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, value: "${db.CA_CERT}" }
      # Set these in the dashboard as encrypted values. The server refuses to start without them.
      - { key: PORTAL_URL, scope: RUN_TIME, type: SECRET, value: "https://CHANGE-ME" }        # the final address, https
      - { key: PORTAL_CODE_KEY, scope: RUN_TIME, type: SECRET, value: "CHANGE-ME" }           # 32 random bytes, base64; keep a copy in the password manager
