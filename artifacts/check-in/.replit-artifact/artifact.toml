kind = "web"
previewPath = "/check-in/"
title = "Two-Step Check-In"
version = "1.0.0"
id = "artifacts/check-in"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24089
name = "web"
paths = ["/check-in/"]

[services.development]
run = "pnpm --filter @workspace/check-in run dev"

[services.env]
PORT = "24089"
BASE_PATH = "/check-in/"

[services.production]
build = ["pnpm", "--filter", "@workspace/check-in", "run", "build"]
publicDir = "artifacts/check-in/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
