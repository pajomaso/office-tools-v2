kind = "web"
previewPath = "/ptc-site/"
title = "Portuguese Tech Communities"
version = "1.0.0"
id = "artifacts/ptc-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24088
name = "web"
paths = ["/ptc-site/"]

[services.development]
run = "pnpm --filter @workspace/ptc-site run dev"

[services.env]
PORT = "24088"
BASE_PATH = "/ptc-site/"

[services.production]
build = ["pnpm", "--filter", "@workspace/ptc-site", "run", "build"]
publicDir = "artifacts/ptc-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
