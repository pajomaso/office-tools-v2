openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: The Office Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room booking operations
  - name: bookings
    description: Booking operations
  - name: inventory
    description: Inventory request operations
  - name: maintenance
    description: Maintenance ticket operations
  - name: vendors
    description: Vendor directory operations
  - name: scheduled-maintenance
    description: Scheduled maintenance operations
  - name: uploads
    description: File upload operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rooms:
    get:
      operationId: getRooms
      tags: [rooms]
      summary: Get all rooms
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"

  /rooms/{id}:
    put:
      operationId: updateRoom
      tags: [rooms]
      summary: Update a room (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
      responses:
        "200":
          description: Room updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"

  /bookings:
    get:
      operationId: getBookings
      tags: [bookings]
      summary: Get all bookings
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Booking conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    put:
      operationId: updateBooking
      tags: [bookings]
      summary: Update a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Booking deleted

  /inventory:
    get:
      operationId: getInventoryRequests
      tags: [inventory]
      summary: Get all inventory requests
      responses:
        "200":
          description: List of inventory requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryRequest"
    post:
      operationId: createInventoryRequest
      tags: [inventory]
      summary: Create an inventory request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryRequestBody"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRequest"

  /inventory/{id}:
    put:
      operationId: updateInventoryRequest
      tags: [inventory]
      summary: Update inventory request status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryRequestBody"
      responses:
        "200":
          description: Request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRequest"
    delete:
      operationId: deleteInventoryRequest
      tags: [inventory]
      summary: Delete an inventory request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Request deleted

  /inventory/{id}/upvote:
    post:
      operationId: upvoteInventoryRequest
      tags: [inventory]
      summary: Upvote an inventory request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Upvote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRequest"

  /maintenance:
    get:
      operationId: getMaintenanceTickets
      tags: [maintenance]
      summary: Get all maintenance tickets
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceTicket"
    post:
      operationId: createMaintenanceTicket
      tags: [maintenance]
      summary: Create a maintenance ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceTicketRequest"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTicket"

  /maintenance/{id}:
    put:
      operationId: updateMaintenanceTicket
      tags: [maintenance]
      summary: Update ticket status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaintenanceTicketRequest"
      responses:
        "200":
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTicket"

  /vendors:
    get:
      operationId: getVendors
      tags: [vendors]
      summary: Get vendor directory (admin only)
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorRequest"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    put:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorRequest"
      responses:
        "200":
          description: Vendor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Vendor deleted

  /scheduled-maintenance:
    get:
      operationId: getScheduledMaintenance
      tags: [scheduled-maintenance]
      summary: Get all scheduled maintenance tasks
      responses:
        "200":
          description: List of scheduled tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledMaintenance"
    post:
      operationId: createScheduledMaintenance
      tags: [scheduled-maintenance]
      summary: Create a scheduled maintenance task (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduledMaintenanceRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMaintenance"

  /scheduled-maintenance/{id}:
    put:
      operationId: updateScheduledMaintenance
      tags: [scheduled-maintenance]
      summary: Update a scheduled maintenance task (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduledMaintenanceRequest"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMaintenance"
    delete:
      operationId: deleteScheduledMaintenance
      tags: [scheduled-maintenance]
      summary: Delete a scheduled maintenance task (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted

  /upload:
    post:
      operationId: uploadFile
      tags: [uploads]
      summary: Upload a file (image)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    Room:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        photoUrl:
          type: string
          nullable: true
        capacity:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - capacity
        - createdAt

    CreateRoomRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        photoUrl:
          type: string
          nullable: true
        capacity:
          type: integer
      required:
        - name
        - capacity

    UpdateRoomRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        photoUrl:
          type: string
          nullable: true
        capacity:
          type: integer

    Booking:
      type: object
      properties:
        id:
          type: integer
        roomId:
          type: integer
        roomName:
          type: string
        userName:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - roomId
        - roomName
        - userName
        - title
        - date
        - startTime
        - endTime
        - createdAt

    CreateBookingRequest:
      type: object
      properties:
        roomId:
          type: integer
        userName:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
      required:
        - roomId
        - userName
        - title
        - date
        - startTime
        - endTime

    UpdateBookingRequest:
      type: object
      properties:
        userName:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string

    InventoryRequest:
      type: object
      properties:
        id:
          type: integer
        itemName:
          type: string
        category:
          type: string
          enum: [Food, Office Supply]
        urgency:
          type: string
          enum: [Low, Medium, High]
        requestedBy:
          type: string
        upvotes:
          type: integer
        status:
          type: string
          enum: [Pending, Ordered, Stocked, Denied]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - itemName
        - category
        - urgency
        - requestedBy
        - upvotes
        - status
        - createdAt

    CreateInventoryRequestBody:
      type: object
      properties:
        itemName:
          type: string
        category:
          type: string
          enum: [Food, Office Supply]
        urgency:
          type: string
          enum: [Low, Medium, High]
        requestedBy:
          type: string
      required:
        - itemName
        - category
        - urgency
        - requestedBy

    UpdateInventoryRequestBody:
      type: object
      properties:
        status:
          type: string
          enum: [Pending, Ordered, Stocked, Denied]

    MaintenanceTicket:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [Urgent, General]
        photoUrl:
          type: string
          nullable: true
        reportedBy:
          type: string
        status:
          type: string
          enum: [Reported, In Progress, Fixed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - category
        - reportedBy
        - status
        - createdAt
        - updatedAt

    CreateMaintenanceTicketRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [Urgent, General]
        photoUrl:
          type: string
          nullable: true
        reportedBy:
          type: string
      required:
        - title
        - description
        - category
        - reportedBy

    UpdateMaintenanceTicketRequest:
      type: object
      properties:
        status:
          type: string
          enum: [Reported, In Progress, Fixed]
        title:
          type: string
        description:
          type: string

    Vendor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        specialty:
          type: string
          enum: [Plumber, Electrician, IT, HVAC, Cleaning, General]
        phone:
          type: string
        email:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - specialty
        - phone
        - createdAt

    CreateVendorRequest:
      type: object
      properties:
        name:
          type: string
        specialty:
          type: string
          enum: [Plumber, Electrician, IT, HVAC, Cleaning, General]
        phone:
          type: string
        email:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - name
        - specialty
        - phone

    ScheduledMaintenance:
      type: object
      properties:
        id:
          type: integer
        taskName:
          type: string
        description:
          type: string
          nullable: true
        frequencyDays:
          type: integer
        lastDone:
          type: string
          format: date
          nullable: true
        nextDue:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - taskName
        - frequencyDays
        - nextDue
        - createdAt

    CreateScheduledMaintenanceRequest:
      type: object
      properties:
        taskName:
          type: string
        description:
          type: string
          nullable: true
        frequencyDays:
          type: integer
        lastDone:
          type: string
          format: date
          nullable: true
        nextDue:
          type: string
          format: date
      required:
        - taskName
        - frequencyDays
        - nextDue

    UploadResponse:
      type: object
      properties:
        url:
          type: string
        filename:
          type: string
      required:
        - url
        - filename
